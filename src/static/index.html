<style>body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e2e1; } .mono { font-family: 'IBM Plex Mono', monospace; } input[type="text"], select { background-color: transparent; border: 1px solid #1f1f1f; border-radius: 4px; color: #e5e2e1; padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 100%; } input[type="text"]:focus, select:focus { outline: none; border-color: #e8e8e8; ring: 1px solid #e8e8e8; } .tab-btn.active { border-bottom: 2px solid #e8e8e8; color: #e8e8e8; } @keyframes spin { 100% { transform: rotate(360deg); } } .fa-spin { animation: spin 1s linear infinite; }</style>
<style>body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e2e1; } .mono { font-family: 'IBM Plex Mono', monospace; } input[type="text"], select { background-color: transparent; border: 1px solid #1f1f1f; border-radius: 4px; color: #e5e2e1; padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 100%; } input[type="text"]:focus, select:focus { outline: none; border-color: #e8e8e8; ring: 1px solid #e8e8e8; } .tab-btn.active { border-bottom: 2px solid #e8e8e8; color: #e8e8e8; } @keyframes spin { 100% { transform: rotate(360deg); } } .fa-spin { animation: spin 1s linear infinite; }</style></head>
<body class="min-h-screen flex text-body-md antialiased selection:bg-primary selection:text-background">
<!-- Sidebar - Config Panel -->
<aside class="w-80 border-l-4 bg-[#131313] border-r border-[#1f1f1f] flex flex-col p-6 overflow-y-auto" style="border-left: 4px solid #2a2a2a;">
<div class="mb-10">
<div class="flex items-center gap-3 mb-2" style="color: #e8e8e8;">
<span class="material-symbols-outlined text-2xl">terminal</span>
<h1 class="font-headline-md m-0">Antigravity</h1>
</div>
<p class="text-text-muted mono text-xs uppercase tracking-wider">Discovery Agent_v1.0</p>
</div>
<div class="flex-1">
<h2 class="flex items-center gap-2 font-label-mono text-text-muted uppercase mb-6 pb-2 border-b border-border-subtle">
<span class="material-symbols-outlined text-sm">settings</span> Developer Profile
            </h2>
<form class="space-y-5" id="profile-form">
<div class="form-group flex flex-col gap-1">
<label class="font-label-mono text-on-surface" for="tech-stack">Tech Stack</label>
<input id="tech-stack" placeholder="Python, React..." required="" type="text">
</div>
<div class="form-group flex flex-col gap-1">
<label class="font-label-mono text-on-surface" for="interests">Interests &amp; Domains</label>
<input id="interests" placeholder="AI, Web3..." required="" type="text">
</div>
<div class="form-group flex flex-col gap-1">
<label class="font-label-mono text-on-surface" for="experience-level">Experience Level</label>
<select id="experience-level" required="">
<option value="Beginner">Beginner (1-2 hackathons)</option>
<option selected="" value="Intermediate">Intermediate</option>
<option value="Advanced">Advanced (Veteran)</option>
</select>
</div>
<div class="form-group flex flex-col gap-1">
<label class="font-label-mono text-on-surface" for="weekly-availability">Availability</label>
<select id="weekly-availability" required="">
<option value="5-10 hours">Light (5-10 hrs/wk)</option>
<option selected="" value="10-20 hours">Moderate (10-20 hrs/wk)</option>
<option value="20+ hours">Full-Time (20+ hrs/wk)</option>
</select>
</div>
<button class="w-full mt-4 bg-transparent border hover:text-background transition-colors rounded py-2 px-4 font-label-mono flex items-center justify-center gap-2 hover:bg-[#e8e8e8]" id="btn-save-profile" type="submit" style="border-color: #e8e8e8; color: #e8e8e8;">
<span class="material-symbols-outlined text-sm">save</span> Save Config
                </button>
</form>
</div>
<div class="mt-8 pt-4 border-t border-border-subtle mono text-[11px] text-text-muted flex items-start gap-2" id="profile-status">
<span class="w-2 h-2 rounded-full mt-1 shrink-0" style="background-color: rgb(0, 255, 135);"></span>
<span class="">Profile unconfigured. Initialization pending.</span>
</div>
</aside>
<!-- Main Dashboard View -->
<main class="flex-1 flex flex-col h-screen overflow-hidden">
<!-- Header -->
<header class="px-8 py-6 border-b border-border-subtle flex items-center justify-between bg-background">
<div class="flex items-center gap-6">
<!-- Inline Stats -->
<div class="flex items-center gap-6 mono text-sm">
<div class="flex items-center gap-2">
<span class="text-text-muted uppercase">Scraped:</span>
<span class="font-medium" id="stat-scraped-count" style="color: #e8e8e8;">0</span>
</div>
<div class="w-px h-4 bg-border-subtle"></div>
<div class="flex items-center gap-2">
<span class="text-text-muted uppercase">Matched:</span>
<span class="font-medium" id="stat-matched-count" style="color: #e8e8e8;">0</span>
</div>
<div class="w-px h-4 bg-border-subtle"></div>
<div class="flex items-center gap-2">
<span class="text-text-muted uppercase">Tracked:</span>
<span class="font-medium" id="stat-tracked-count" style="color: #e8e8e8;">0</span>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 mono text-xs">
<label class="text-text-muted" for="ai-provider">PROVIDER:</label>
<select class="py-1 px-2 text-xs w-32 border-border-subtle" disabled="" id="ai-provider">
<option value="gemini">Loading...</option>
</select>
</div>
<button class="bg-transparent border border-border-subtle text-on-surface transition-colors rounded py-1.5 px-4 font-label-mono flex items-center gap-2" disabled="" id="btn-trigger-scrape" style="border-color: #e8e8e8; color: #e8e8e8;">
<span class="material-symbols-outlined text-sm fa-spin hidden" id="scrape-loader">autorenew</span>
<span class="material-symbols-outlined text-sm" id="scrape-icon">sync</span> Scrape
                </button>
<button class="bg-transparent border border-border-subtle text-on-surface transition-colors rounded py-1.5 px-4 font-label-mono flex items-center gap-2" id="btn-trigger-reminders" style="border-color: #e8e8e8; color: #e8e8e8;">
<span class="material-symbols-outlined text-sm">notifications</span> Alerts
                </button>
</div>
</header>
<!-- Main Content Area -->
<div class="flex-1 overflow-y-auto p-8">
<!-- Tab Navigation -->
<div class="border-b border-border-subtle mb-6 flex gap-6 font-label-mono">
<button class="tab-btn pb-3 px-1 text-on-surface hover:text-primary transition-colors flex items-center gap-2 active border-b-2 border-[#e8e8e8] text-[#e8e8e8]" data-tab="tab-recommendations">
<span class="material-symbols-outlined text-sm" style="color: rgb(232, 232, 232);">radar</span> Recommendations
                </button>
<button class="tab-btn pb-3 px-1 hover:text-primary transition-colors flex items-center gap-2 text-text-muted" data-tab="tab-tracked">
<span class="material-symbols-outlined text-sm" style="color: rgb(232, 232, 232);">fact_check</span> Tracked
                </button>
</div>
<!-- Tab 1: Recommendations List -->
<div class="tab-content block" id="tab-recommendations">
<!-- Grid -->
<div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4" id="recommendations-grid">
<div class="col-span-full py-12 mono text-text-muted flex items-center gap-2">
<span class="" style="color: rgb(232, 232, 232);">→</span> No recommendations available. Save profile to initialize scan.
                    </div>
</div>
</div>
<!-- Tab 2: Tracked Dashboard -->
<div class="tab-content hidden" id="tab-tracked">
<!-- Grid -->
<div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4" id="tracked-grid">
<div class="col-span-full py-12 mono text-text-muted flex items-center gap-2">
<span class="" style="color: rgb(232, 232, 232);">→</span> No hackathons tracked yet.
                    </div>
</div>
</div>
</div>
</main>
<!-- Notification Toast -->
<div class="fixed bottom-6 right-6 flex flex-col gap-2 z-50 mono text-sm" id="toast-container"></div>
<script src="app.js"></script>
<script>
        // Simple tab switching logic for visual purposes, assuming app.js handles primary logic
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'border-b-2', 'border-primary', 'text-primary');
                    b.classList.add('text-text-muted');
                });
                btn.classList.add('active', 'border-b-2', 'border-primary', 'text-primary');
                btn.classList.remove('text-text-muted');
                
                const tabId = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => {
                    if(content.id === tabId) {
                        content.classList.remove('hidden');
                        content.classList.add('block');
                    } else {
                        content.classList.add('hidden');
                        content.classList.remove('block');
                    }
                });
            });
        });
    </script>


</body></html>
